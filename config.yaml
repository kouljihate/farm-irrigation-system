# Global configuration for the Farm Irrigation Workbench

app:
  title: "Farm Irrigation Workbench"
  version: "2.3.0"

mongodb:
  host: "localhost"
  port: 27017
  database: "farm_irrigation"

paths:
  imports: "imports"
  exports: "exports"

# Domain defaults for the irrigation design workflow.
geometry:
  sector_target_area_ha: 1.0
  zones_per_sector: 2
  smart_geometry: true

# Default build parameters pre-filled on each step page.
defaults:
  row_spacing_m: 4.0
  tree_spacing_m: 4.0
  first_row_offset_m: 2.0
  pipe_main_diameter_mm: 90
  pipe_submain_diameter_mm: 63
  pipe_drip_diameter_mm: 32
  mainline_offset_m: 5
  submain_offset_m: 5
  emitter_spacing_m: 0.5

# Engineering assumptions used by the design checks.
hydraulics:
  emitter_discharge_lph: 2.0
  operating_hours_per_day: 6.0
  demand_margin: 1.15
  hazen_williams_c: 150
  design_slope: 0.002
  min_velocity_ms: 0.3
  max_velocity_ms: 2.0
  oversized_below_ratio: 0.8
  undersized_above_ratio: 1.25
  max_headloss_m: 10.0